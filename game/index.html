<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Skillet — Rush-Hour Kitchen</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b2118;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    width: min(100vw, calc(100vh * 1.6));
    aspect-ratio: 1280 / 800;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
